<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIE — Behavior Analysis Chatbot</title>
    <meta name="description" content="Upload your PIE sensor CSV and get AI-powered behavior insights.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-glass: rgba(17, 24, 39, 0.65);
            --border: rgba(99, 102, 241, 0.2);
            --accent: #818cf8;
            --accent-bright: #a5b4fc;
            --accent-glow: rgba(129, 140, 248, 0.25);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #34d399;
            --error: #f87171;
            --user-bubble: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --ai-bubble: rgba(30, 41, 59, 0.8);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 600px 400px at 20% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 70%),
                radial-gradient(ellipse 500px 350px at 80% 70%, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ─── header ──────────────────────── */
        .header {
            width: 100%;
            padding: 18px 32px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            background: var(--bg-glass);
            z-index: 10;
            position: relative;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--user-bubble);
            display: grid;
            place-items: center;
            font-size: 20px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .header-text h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-text p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s ease infinite;
            margin-left: auto;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        /* ─── chat area ───────────────────── */
        .chat-wrapper {
            flex: 1;
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        /* bubbles */
        .msg {
            max-width: 88%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 14px;
            animation: fadeUp .35s ease;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            align-self: flex-end;
            background: var(--user-bubble);
            border-bottom-right-radius: 6px;
            color: #fff;
        }

        .msg.ai {
            align-self: flex-start;
            background: var(--ai-bubble);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
            color: var(--text-primary);
        }

        .msg.ai .label {
            font-weight: 600;
            color: var(--accent-bright);
        }

        .msg.system {
            align-self: center;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 8px;
        }

        /* typing indicator */
        .typing {
            display: flex;
            gap: 5px;
            padding: 14px 22px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-8px);
            }
        }

        /* ─── upload area ─────────────────── */
        .input-area {
            padding: 16px 20px 24px;
            border-top: 1px solid var(--border);
            backdrop-filter: blur(20px);
            background: var(--bg-glass);
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all .25s ease;
            position: relative;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .drop-zone.has-file {
            border-color: var(--success);
            background: rgba(52, 211, 153, 0.06);
        }

        .drop-zone input {
            display: none;
        }

        .drop-icon {
            font-size: 36px;
            margin-bottom: 8px;
            display: block;
        }

        .drop-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .drop-label span {
            color: var(--accent-bright);
            font-weight: 600;
            cursor: pointer;
        }

        .file-name {
            display: none;
            margin-top: 8px;
            font-size: 13px;
            color: var(--success);
            font-weight: 500;
        }

        .drop-zone.has-file .file-name {
            display: block;
        }

        .drop-zone.has-file .drop-label {
            display: none;
        }

        .drop-zone.has-file .drop-icon::after {
            content: '✅';
            font-size: 36px;
        }

        .drop-zone.has-file .drop-icon-default {
            display: none;
        }

        .btn-analyze {
            margin-top: 14px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--user-bubble);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s ease;
            letter-spacing: 0.3px;
        }

        .btn-analyze:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--accent-glow);
        }

        .btn-analyze:active {
            transform: scale(0.98);
        }

        .btn-analyze:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ─── profile card ────────────────── */
        .profile-card {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .profile-card .chip {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid var(--border);
            color: var(--accent-bright);
        }

        /* responsive */
        @media (max-width: 600px) {
            .chat-wrapper {
                max-width: 100%;
            }

            .msg {
                max-width: 94%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-icon">🧠</div>
        <div class="header-text">
            <h1>Hey Nisarg 👋</h1>
            <p>Upload your behavior data CSV for personalized analysis</p>
        </div>
        <div class="status-dot" title="Online"></div>
    </div>

    <div class="chat-wrapper">
        <div class="chat-messages" id="chatMessages">
            <div class="msg system">Upload a PIE sensor CSV to get started ✨</div>
        </div>

        <div class="input-area">
            <div class="drop-zone" id="dropZone">
                <input type="file" id="fileInput" accept=".csv">
                <span class="drop-icon"><span class="drop-icon-default">📂</span></span>
                <p class="drop-label">Drag &amp; drop your CSV here or <span
                        onclick="document.getElementById('fileInput').click()">browse</span></p>
                <p class="file-name" id="fileName"></p>
            </div>
            <button class="btn-analyze" id="btnAnalyze" disabled>Analyze with AI ✦</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const btnAnalyze = document.getElementById('btnAnalyze');
        const chatMessages = document.getElementById('chatMessages');

        let selectedFile = null;

        /* ── drag & drop ────────────────────── */
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

        function handleFile(file) {
            if (!file.name.endsWith('.csv')) {
                addMsg('system', '⚠️ Please upload a .csv file');
                return;
            }
            selectedFile = file;
            fileName.textContent = '📎 ' + file.name;
            dropZone.classList.add('has-file');
            btnAnalyze.disabled = false;
        }

        /* ── chat helpers ───────────────────── */
        function addMsg(type, html) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.innerHTML = html;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'msg ai typing';
            div.id = 'typingIndicator';
            div.innerHTML = '<span></span><span></span><span></span>';
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function formatAIResponse(text) {
            // Highlight Observation / Reason / Suggestion labels
            return text
                .replace(/^(Observation:)/gm, '<span class="label">$1</span>')
                .replace(/^(Reason:)/gm, '<span class="label">$1</span>')
                .replace(/^(Suggestion:)/gm, '<span class="label">$1</span>');
        }

        /* ── analyze ────────────────────────── */
        btnAnalyze.addEventListener('click', async () => {
            if (!selectedFile) return;

            addMsg('user', '📎 Uploaded <strong>' + selectedFile.name + '</strong>');
            btnAnalyze.disabled = true;
            showTyping();

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const res = await fetch('/analyze', { method: 'POST', body: formData });
                const data = await res.json();
                hideTyping();

                if (data.error) {
                    addMsg('ai', '❌ ' + data.error);
                } else {
                    // Profile chips
                    const profile = data.profile;
                    const chips = `
                <div class="profile-card">
                    <span class="chip">🟢 Active ${(profile.Active * 100).toFixed(1)}%</span>
                    <span class="chip">🔴 Inactive ${(profile.Inactive * 100).toFixed(1)}%</span>
                    <span class="chip">🟡 Irregular ${(profile.Irregular * 100).toFixed(1)}%</span>
                </div>`;
                    addMsg('ai', formatAIResponse(data.response) + chips);
                }
            } catch (err) {
                hideTyping();
                addMsg('ai', '❌ Network error — is the server running?');
            }

            // reset for next upload
            selectedFile = null;
            dropZone.classList.remove('has-file');
            fileInput.value = '';
            btnAnalyze.disabled = true;
        });
    </script>
</body>

</html>
